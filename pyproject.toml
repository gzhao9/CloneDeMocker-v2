[project]
name = "clonedemocker-ui"
version = "2.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.0.0",
    # CCTR（RQ2.2 的可读性指标）要用 tree-sitter 重新解析打过补丁的方法体，才能把注解
    # 一起框进来、与检测器给的 testMethodRawCode 形状对齐。以前靠 `uv run --with ...`
    # 临时装，界面进程里就没有——把报告写进 data/ 时顺带算 CCTR 也就无从谈起。
    # CCTR (the RQ2.2 readability metric) re-parses each patched method with tree-sitter so
    # its annotations are included and its shape matches the detector's testMethodRawCode.
    # It used to be installed ad hoc via `uv run --with ...`, which left it absent from the UI
    # process and made computing CCTR alongside the report impossible.
    "tree-sitter>=0.21",
    "tree-sitter-java>=0.21",
]

[tool.uv]
package = false
